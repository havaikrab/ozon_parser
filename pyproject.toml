[project]
name = "ozon-parser"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "zendriver (>=0.16.0,<0.17.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "google-api-python-client (>=2.200.0,<3.0.0)",
    "google-auth-httplib2 (>=0.4.2,<0.5.0)",
    "google-auth-oauthlib (>=1.4.1,<2.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "curl-cffi (>=0.16.3,<0.17.0)",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "isort (>=9.0.1,<10.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.3.1,<3.0.0)"
]

[tool.black]
line-length = 119
exclude = '''
/(
\.venv|
\.git|
\.mypy_cache|
\.pytest_cache|
build|
dist
venv
)/
'''

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude_gitignore = true
follow_untyped_imports = true
